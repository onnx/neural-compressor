[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx_neural_compressor"
dynamic = ["version"]
description = "Model compression techniques for ONNX models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Intel AIPT Team" },
]
keywords = ["quantization", "ONNX"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnx",
    "onnxruntime",
    "psutil",
    "prettytable",
    "scipy",
    "numpy",
    "py-cpuinfo",
    "pydantic",
    "transformers<5",
]

[project.optional-dependencies]
test = [
    "optimum[onnxruntime]<2; python_version < '3.14'",
    "pytest",
    "sympy",
    "torch<2.9; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/onnx/neural-compressor"
Repository = "https://github.com/onnx/neural-compressor"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = ["VERSION_NUMBER"] }

[tool.setuptools.packages.find]
include = ["onnx_neural_compressor*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Keep the initial rules compatible with the existing codebase while replacing
# isort with Ruff. New rule families can be enabled incrementally.
select = [
    "E4", # pycodestyle imports
    "E7", # pycodestyle statements
    "E9", # pycodestyle runtime errors
    "F",  # Pyflakes
    "I",  # isort
]
ignore = [
    "E402", # Module level import not at top of file
    "E501", # Line too long (121 > 120 characters)
    "E721", # Do not compare types, use isinstance()
    "E722", # Do not use bare except
    "E731", # Do not assign a lambda expression, use a def
    "E741", # Do not use variables named ‘l’, ‘O’, or ‘I’
    "F401", # {name} imported but unused
    "F403", # from {name} import * used; unable to detect undefined names
    "F405", # {name} may be undefined, or defined from star imports
    "F841", # Local variable is assigned to but never used{name}
]
